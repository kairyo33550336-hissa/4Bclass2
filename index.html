<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4Bカレンダー</title>
<style>
:root {
--primary-color: #4a90e2;
--bg-color: #f4f7f6;
--text-color: #333;
}
#login-screen { box-sizing: border-box; }
button:disabled { opacity: .6; cursor: wait; }
body {
font-family: 'Helvetica Neue', Arial, sans-serif;
background-color: var(--bg-color);
color: var(--text-color);
margin: 0;
padding: 10px;
}
.container {
max-width: 1000px;
margin: 0 auto;
}
h1, h2 { text-align: center; }

.panel {
  background: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  margin-bottom: 20px;
}

.calendar-scroll-wrapper {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  background: white;
  padding: 5px;
  border-radius: 8px;
  min-width: 600px;
}
.day-header {
  font-weight: bold;
  text-align: center;
  padding: 5px;
  background: #eef2f5;
}
.timetable-header {
  font-size: 0.75em;
  background: #fdf6e3;
  padding: 4px;
  min-height: 100px;
  border: 1px dashed #d3d3d3;
  line-height: 1.3;
}
.day-cell {
  border: 1px solid #ddd;
  min-height: 90px;
  padding: 5px;
  background: #fff;
}
.day-number { font-weight: bold; margin-bottom: 5px; }

/* 予定のスタイルとタグ色設定 */
.event-item {
  font-size: 0.75em;
  padding: 4px;
  margin-bottom: 4px;
  border-radius: 3px;
  word-break: break-all;
}
.event-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.event-time {
  font-weight: bold;
}
.event-desc {
  margin-top: 2px;
}
.tag-default { background: #e3f2fd; color: #0d47a1; border-left: 3px solid #1e88e5; }
.tag-danger  { background: #ffebee; color: #b71c1c; border-left: 3px solid #e53935; }
.tag-success { background: #e8f5e9; color: #1b5e20; border-left: 3px solid #4caf50; }
.tag-warning { background: #fff3e0; color: #e65100; border-left: 3px solid #fb8c00; }
.tag-purple  { background: #f3e5f5; color: #4a148c; border-left: 3px solid #8e24aa; }

.vacation-banner {
  font-size: 0.75em;
  background: #e1f5fe;
  color: #0288d1;
  border: 1px solid #81d4fa;
  padding: 2px 4px;
  margin-bottom: 4px;
  border-radius: 3px;
  text-align: center;
  font-weight: bold;
}

.form-group { margin-bottom: 10px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 8px;
  box-sizing: border-box;
}
button {
  background: var(--primary-color);
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
}
.btn-small {
  padding: 2px 6px;
  font-size: 0.75em;
  margin-left: 3px;
  background: #6c757d;
  flex-shrink: 0;
}
.btn-danger { background: #dc3545; }
.btn-edit { background: #ffc107; color: #000; }

.card-list {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-top: 15px;
}
.card-item {
  border: 1px solid #ddd;
  padding: 12px;
  border-radius: 4px;
  background: #fafafa;
}
.card-item.hr-notice { border-left: 5px solid #007bff; }
.card-item.task { border-left: 5px solid #ff9800; }

.vacation-list {
  margin-top: 10px;
  font-size: 0.85em;
}
.status-banner {
  padding: 10px;
  background: #fff3cd;
  color: #856404;
  border-radius: 4px;
  margin-bottom: 15px;
  text-align: center;
  font-size: 0.9em;
}

.timetable-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}

.exam-date-row {
  background: #fdf8e4;
  padding: 8px;
  border-radius: 4px;
  margin-bottom: 8px;
  border: 1px solid #ffeba8;
}

/* スマートフォンでは、ログイン後のアプリ本体をPCに近い幅で表示し、
   ページ全体を横スクロールできるようにする。ログイン画面は従来どおり画面幅に合わせる。 */
@media (max-width: 700px) {
  body {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  #app-container.container {
    width: 1000px;
    max-width: none;
    margin-left: 0;
    margin-right: 0;
  }
}

</style>

<!-- Firebase SDK (compat版) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
<div id="login-screen" class="panel" style="max-width:440px;margin:8vh auto;text-align:center;">
  <h1>4Bカレンダー</h1>
  <p>学校のメールアドレスで登録・ログインしてください。<br>登録後、確認メールのリンクを開く必要があります。</p>
  <div class="form-group" style="text-align:left;">
    <label for="auth-email">学校のメールアドレス</label>
    <input type="email" id="auth-email" autocomplete="email" placeholder="例: user@waseda-h.ed.jp">
  </div>
  <div class="form-group" style="text-align:left;">
    <label for="auth-password">パスワード（8文字以上）</label>
    <input type="password" id="auth-password" autocomplete="current-password" minlength="8" placeholder="パスワード">
  </div>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
    <button type="button" id="email-signin-btn" onclick="signInWithEmail()">ログイン</button>
    <button type="button" id="email-register-btn" onclick="registerWithEmail()">新規登録</button>
  </div>
  <button type="button" id="password-reset-btn" onclick="resetPassword()" style="margin-top:8px;background:#6c757d;">パスワードを忘れた場合</button>
  <p id="login-message" role="status" aria-live="polite" style="color:#b71c1c;white-space:pre-wrap;"></p>
</div>

<div class="container" id="app-container" style="display:none;">
<h1>4Bカレンダー</h1>
<div style="display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;">
  <span id="signed-in-email" style="font-size:.85em;color:#555;">ログイン中</span>
  <button type="button" onclick="signOutUser()" style="background:#6c757d;">ログアウト</button>
</div>

<div id="connection-status" class="status-banner">接続状態を確認中...</div>

<!-- 時間割・試験・休業期間設定 -->
<details class="panel">
<summary><strong>時間割・定期試験・長期休業の設定</strong></summary>

<h4 style="margin-top:15px;">■ 通常時間割の設定 (月〜土)</h4>
<form id="timetable-form">
  <div id="timetable-inputs" class="timetable-grid"></div>
  <button type="button" onclick="saveTimetable()" style="margin-top: 10px;">通常時間割を保存（HR委員のみ）</button>
</form>

<hr style="margin: 20px 0;">

<h4>■ 定期試験期間と日別時間割（最大3限）の設定</h4>
<div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px;">
  <div style="flex: 1; min-width: 120px;">
    <label>開始日</label>
    <input type="date" id="exam-start" onchange="generateExamDateInputs()">
  </div>
  <div style="flex: 1; min-width: 120px;">
    <label>終了日</label>
    <input type="date" id="exam-end" onchange="generateExamDateInputs()">
  </div>
  <div style="flex: 1; min-width: 120px;">
    <label>試験名</label>
    <input type="text" id="exam-name" placeholder="例: 中間テスト">
  </div>
</div>

<div id="exam-daily-inputs-container"></div>

<button type="button" id="btn-save-exam" onclick="addExamSchedule()" style="display:none; margin-top:10px;">定期試験日程・時間割を登録（HR委員のみ）</button>
<div class="vacation-list" id="exam-list-display"></div>

<hr style="margin: 20px 0;">

<h4>■ 長期休業期間（夏休み・冬休みなど）の指定</h4>
<div style="display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;">
  <div style="flex: 1; min-width: 120px;">
    <label>開始日</label>
    <input type="date" id="vacation-start">
  </div>
  <div style="flex: 1; min-width: 120px;">
    <label>終了日</label>
    <input type="date" id="vacation-end">
  </div>
  <div style="flex: 1; min-width: 120px;">
    <label>休みの名称</label>
    <input type="text" id="vacation-name" placeholder="例: 夏休み">
  </div>
  <button type="button" onclick="addVacation()">休業期間を追加</button>
</div>
<div class="vacation-list" id="vacation-list-display"></div>

</details>

<!-- カレンダー本体 -->
<div class="panel">
<div class="calendar-header">
<button type="button" onclick="changeMonth(-1)">前月</button>
<h2 id="month-display" style="margin:0; font-size:1.2em;"></h2>
<button type="button" onclick="changeMonth(1)">翌月</button>
</div>
<div class="calendar-scroll-wrapper">
<div class="calendar-grid" id="calendar-grid"></div>
</div>
</div>

<!-- お知らせ・予定送信機能 -->
<div class="panel">
<h3 id="event-form-title">予定の登録・編集</h3>
<input type="hidden" id="event-edit-index" value="-1">
<input type="hidden" id="event-edit-scope" value="">
<div class="form-group">
<label>公開範囲</label>
<select id="event-scope">
<option value="shared">全体共有（全員のカレンダーに表示）</option>
<option value="personal">個人専用（自分の端末にのみ表示）</option>
</select>
</div>
<div class="form-group">
<label>タグ（色分け）</label>
<select id="event-tag">
<option value="default">通常（青）</option>
<option value="danger">提出物 / テスト（赤）</option>
<option value="success">行事 / イベント（緑）</option>
<option value="warning">部活 / 習い事（オレンジ）</option>
<option value="purple">その他（紫）</option>
</select>
</div>
<div class="form-group">
<label>日付</label>
<input type="date" id="event-date">
</div>
<div class="form-group">
<label>時間 または 何時間目か</label>
<input type="text" id="event-time" placeholder="例: 10:00 や 3時間目">
</div>
<div class="form-group">
<label>内容</label>
<input type="text" id="event-desc" placeholder="例: 提出物締め切り / 部活練習">
</div>
<button type="button" id="event-submit-btn" onclick="sendNotice()">予定を追加</button>
<button type="button" id="event-cancel-btn" onclick="cancelEventEdit()" style="display:none; background:#888;">キャンセル</button>
</div>

<!-- クラス掲示板（学校アカウントでログインした全員が投稿・編集・削除可能） -->
<div class="panel">
<h3 id="hr-form-title">クラス掲示板</h3>
<div class="form-group">
<label for="hr-text">投稿内容</label>
<textarea id="hr-text" maxlength="2000" placeholder="クラスへの連絡・質問など（2000文字以内）" style="height: 100px;"></textarea>
<input type="hidden" id="hr-edit-index" value="-1">
<div style="margin-top: 8px;">
<button type="button" id="hr-submit-btn" onclick="sendHRNotice()">投稿する</button>
<button type="button" id="hr-cancel-btn" onclick="cancelHREdit()" style="display:none; background:#888;">編集をキャンセル</button>
</div>
<p style="font-size:.8em;color:#666;">学校アカウントでログインした人は投稿を編集・削除できます。個人情報やパスワードは書き込まないでください。</p>
</div>
<div id="hr-list-display" class="card-list"></div>
</div>

<!-- 課題掲示板 -->
<div class="panel">
<h3 id="task-form-title">課題掲示板（写真添付可・全員共有）</h3>
<input type="hidden" id="task-edit-index" value="-1">
<div class="form-group">
<label>科目・タイトル</label>
<input type="text" id="task-title" placeholder="例: 数学II 週末課題">
</div>
<div class="form-group">
<label>詳細・メモ</label>
<textarea id="task-detail" style="height: 60px;" placeholder="例: P.45〜48 ノートに解いて提出"></textarea>
</div>
<div class="form-group">
<label>写真・画像の添付（任意）</label>
<input type="file" id="task-image" accept="image/*">
<div id="task-image-preview" style="margin-top: 5px; font-size: 0.8em; color: #666;"></div>
</div>
<button type="button" id="task-submit-btn" onclick="postTask()">課題を投稿する</button>
<button type="button" id="task-cancel-btn" onclick="cancelTaskEdit()" style="display:none; background:#888;">キャンセル</button>

<hr style="margin: 20px 0;">
<div id="task-board-list" class="card-list"></div>

</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAToSDEpvxlG-7N22fWijeoFySSKTfGeLw",
  authDomain: "class-submission-calenda-7ad76.firebaseapp.com",
  databaseURL: "https://class-submission-calenda-7ad76-default-rtdb.us-central1.firebasedatabase.app",
  projectId: "class-submission-calenda-7ad76",
  storageBucket: "class-submission-calenda-7ad76.firebasestorage.app",
  messagingSenderId: "312652354036",
  appId: "1:312652354036:web:ab349a730f21965caa29a1"
};

const SCHOOL_DOMAIN = "waseda-h.ed.jp"; // 例: school.ed.jp（@は付けない）
const HR_UIDS = ["REPLACE_WITH_HR_UID"]; // HR委員のFirebase Authentication UIDに置き換える

let db = null;
let auth = null;
let realtimeSyncStarted = false;
const SYNC_PATHS = ["timetable", "events", "vacations", "exams", "hr_notices", "task_board"];

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  auth = firebase.auth();

  const connectedRef = db.ref(".info/connected");
  connectedRef.on("value", (snap) => {
    const statusEl = document.getElementById("connection-status");
    if (!statusEl) return;
    if (snap.val() === true) {
      statusEl.style.background = "#d4edda";
      statusEl.style.color = "#155724";
      statusEl.textContent = "🟢 オンライン: リアルタイム同期が有効です";
    } else {
      statusEl.style.background = "#f8d7da";
      statusEl.style.color = "#721c24";
      statusEl.textContent = "🔴 オフライン: サーバーに接続されていません";
    }
  });
} catch (e) {
  console.error("Firebase初期化エラー:", e);
  const statusEl = document.getElementById("connection-status");
  if (statusEl) statusEl.textContent = "❌ Firebase初期化エラー。設定値を確認してください。";
}

function showLogin(message = "") {
  document.getElementById("login-screen").style.display = "block";
  document.getElementById("app-container").style.display = "none";
  document.getElementById("login-message").textContent = message;
  document.getElementById("signed-in-email").textContent = "";
}

function showApp(user) {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-container").style.display = "block";
  document.getElementById("login-message").textContent = "";
  // メールアドレスは画面に表示しない（掲示板やヘッダーからの漏えい防止）。
  document.getElementById("signed-in-email").textContent = "ログイン中";
}

function isSchoolAccount(user) {
  if (!user || !user.email) return false;
  const at = user.email.lastIndexOf("@");
  if (at < 0) return false;
  const domain = user.email.slice(at + 1).toLowerCase();
  return SCHOOL_DOMAIN !== "YOUR_SCHOOL_DOMAIN" &&
    domain === SCHOOL_DOMAIN.toLowerCase() &&
    user.emailVerified === true;
}

function validateSchoolEmail(email) {
  const normalized = String(email || "").trim().toLowerCase();
  const at = normalized.lastIndexOf("@");
  if (at <= 0) return false;
  return normalized.slice(at + 1) === SCHOOL_DOMAIN.toLowerCase();
}

function showAuthError(error, action) {
  console.error(action + "エラー:", error);
  const messages = {
    "auth/email-already-in-use": "このメールアドレスは既に登録されています。ログインしてください。",
    "auth/invalid-email": "メールアドレスの形式を確認してください。",
    "auth/weak-password": "パスワードは8文字以上にしてください。",
    "auth/operation-not-allowed": "Firebase Consoleで「メール/パスワード」認証を有効にしてください。",
    "auth/too-many-requests": "試行回数が多すぎます。しばらく待ってから再試行してください。",
    "auth/user-not-found": "アカウントが見つからないか、パスワードが違います。",
    "auth/wrong-password": "アカウントが見つからないか、パスワードが違います。",
    "auth/invalid-credential": "メールアドレスまたはパスワードが正しくありません。",
    "auth/network-request-failed": "通信に失敗しました。ネットワーク接続を確認してください。"
  };
  showLogin(messages[error && error.code] || "処理に失敗しました。入力内容とFirebase Authenticationの設定を確認してください。");
}

async function registerWithEmail() {
  if (!auth) return showLogin("Firebaseの設定値を確認してください。");
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if (!validateSchoolEmail(email)) {
    showLogin("@" + SCHOOL_DOMAIN + " の学校メールアドレスを入力してください。");
    return;
  }
  if (password.length < 8) {
    showLogin("パスワードは8文字以上にしてください。");
    return;
  }
  const button = document.getElementById("email-register-btn");
  button.disabled = true;
  try {
    const result = await auth.createUserWithEmailAndPassword(email, password);
    try {
      await result.user.sendEmailVerification();
      await auth.signOut();
      showLogin("登録しました。確認メールを送信しました。\nメール内のリンクを開いてから、ログインしてください。迷惑メールフォルダも確認してください。");
    } catch (verificationError) {
      console.error("確認メール送信エラー:", verificationError);
      try { await auth.signOut(); } catch (_) {}
      showLogin("アカウントは作成されましたが、確認メールを送信できませんでした。時間をおいてログインし、再送信できるか確認してください。");
    }
  } catch (error) {
    showAuthError(error, "新規登録");
  } finally {
    button.disabled = false;
  }
}

async function signInWithEmail() {
  if (!auth) return showLogin("Firebaseの設定値を確認してください。");
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  if (!validateSchoolEmail(email)) {
    showLogin("@" + SCHOOL_DOMAIN + " の学校メールアドレスを入力してください。");
    return;
  }
  if (!password) {
    showLogin("パスワードを入力してください。");
    return;
  }
  const button = document.getElementById("email-signin-btn");
  button.disabled = true;
  try {
    const result = await auth.signInWithEmailAndPassword(email, password);
    await result.user.reload();
    const user = auth.currentUser;
    if (!user || !validateSchoolEmail(user.email)) {
      await auth.signOut();
      showLogin("学校指定のメールアドレスでログインしてください。");
      return;
    }
    if (!user.emailVerified) {
      let resendMessage = "確認メールを再送信できませんでした。少し待ってからもう一度ログインしてください。";
      try {
        await user.sendEmailVerification();
        resendMessage = "メールアドレスが未確認です。確認メールを再送信しました。メール内のリンクを開いてから、もう一度ログインしてください。";
      } catch (verificationError) {
        console.error("確認メール再送信エラー:", verificationError);
      }
      await auth.signOut();
      showLogin(resendMessage + "\n迷惑メールフォルダも確認してください。");
      return;
    }
    showApp(user);
    initializeAppAfterLogin();
  } catch (error) {
    showAuthError(error, "ログイン");
  } finally {
    button.disabled = false;
  }
}

async function resetPassword() {
  if (!auth) return showLogin("Firebaseの設定値を確認してください。");
  const email = document.getElementById("auth-email").value.trim();
  if (!validateSchoolEmail(email)) {
    showLogin("先に @" + SCHOOL_DOMAIN + " の学校メールアドレスを入力してください。");
    return;
  }
  const button = document.getElementById("password-reset-btn");
  button.disabled = true;
  try {
    await auth.sendPasswordResetEmail(email);
    showLogin("パスワード再設定メールを送信しました。受信トレイと迷惑メールフォルダを確認してください。");
  } catch (error) {
    showAuthError(error, "パスワード再設定");
  } finally {
    button.disabled = false;
  }
}

async function signOutUser() {
  if (!auth) return;
  try {
    await auth.signOut();
    showLogin("ログアウトしました。");
  } catch (error) {
    console.error("ログアウトエラー:", error);
    alert("ログアウトに失敗しました。");
  }
}

function isHRUser() {
  const user = auth && auth.currentUser;
  return !!user && HR_UIDS.filter(uid => uid !== "REPLACE_WITH_HR_UID").includes(user.uid);
}

function requireHR() {
  if (isHRUser()) return true;
  alert("この操作は登録されたHR委員アカウントのみ実行できます。HR_UIDSの設定とFirebaseのセキュリティルールを確認してください。");
  return false;
}

function stopRealtimeSync() {
  if (db) SYNC_PATHS.forEach(path => db.ref(path).off());
  realtimeSyncStarted = false;
}

function initializeAppAfterLogin() {
  if (realtimeSyncStarted) return;
  realtimeSyncStarted = true;
  generateTimetableInputs();
  try {
    personalEventsData = JSON.parse(localStorage.getItem("personal_events") || "[]");
    if (!Array.isArray(personalEventsData)) personalEventsData = [];
  } catch {
    personalEventsData = [];
  }
  initRealtimeSync();
}
let currentDate = new Date();
const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

let timeTableData = {};
let sharedEventsData = [];
let personalEventsData = [];
let vacationsData = [];
let examsData = [];
let hrData = [];
let taskBoardData = [];

window.addEventListener("load", async () => {
  if (!auth) {
    showLogin("Firebaseの設定値を確認してください。");
    return;
  }
  showLogin();
  try {
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  } catch (error) {
    console.error("ログイン状態の保存設定エラー:", error);
  }
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      stopRealtimeSync();
      showLogin();
      return;
    }
    try {
      await user.reload();
      const refreshedUser = auth.currentUser;
      if (!isSchoolAccount(refreshedUser)) {
        await auth.signOut();
        showLogin("メールアドレスの確認が完了していないか、学校指定のメールアドレスではありません。確認メール内のリンクを開いてください。");
        return;
      }
      showApp(refreshedUser);
      initializeAppAfterLogin();
    } catch (error) {
      console.error("ログイン状態の確認エラー:", error);
      showLogin("ログイン状態を確認できませんでした。もう一度ログインしてください。");
    }
  });
});

function normalizeList(value) {
  if (Array.isArray(value)) return value;
  if (value && typeof value === "object") {
    return Object.keys(value)
      .sort((a, b) => Number(a) - Number(b))
      .map(key => value[key]);
  }
  return [];
}

function initRealtimeSync() {
if (!db) return;

db.ref('timetable').on('value', (snap) => {
  timeTableData = snap.val() || {};
  updateTimetableInputs();
  renderCalendar();
});

db.ref('events').on('value', (snap) => {
  sharedEventsData = normalizeList(snap.val());
  renderCalendar();
});

db.ref('vacations').on('value', (snap) => {
  vacationsData = normalizeList(snap.val());
  renderCalendar();
});

db.ref('exams').on('value', (snap) => {
  examsData = normalizeList(snap.val());
  renderCalendar();
});

db.ref('hr_notices').on('value', (snap) => {
  hrData = normalizeList(snap.val());
  renderHRNotices();
});

db.ref('task_board').on('value', (snap) => {
  taskBoardData = normalizeList(snap.val());
  renderTaskBoard();
});

}

async function pushData(path, data) {
  if (!db) {
    alert("Firebaseに接続できません。ページを再読み込みしてください。");
    return false;
  }
  try {
    await db.ref(path).set(data);
    return true;
  } catch (error) {
    console.error("Firebase保存エラー:", path, error);
    let reason = "保存できませんでした。ログイン状態とFirebaseのセキュリティルールを確認してください。";
    if (error && error.code === "PERMISSION_DENIED") {
      reason = "Firebaseに保存を拒否されました。ログイン自体が成功していても、Realtime Databaseのルールで task_board への書き込みが許可されていない可能性があります。Firebase Console → Realtime Database → ルール を確認してください。詳細は開発者ツールのConsoleにも記録しています。";
    } else if (error && error.code === "NETWORK_ERROR") {
      reason = "通信に失敗したため保存できませんでした。ネットワーク接続を確認してください。";
    }
    alert(reason);
    // 保存失敗時は、サーバー上の値を読み直して画面上の未保存変更を戻す。
    try {
      const snap = await db.ref(path).once("value");
      const value = snap.val();
      if (path === "timetable") {
        timeTableData = value || {};
        updateTimetableInputs();
        renderCalendar();
      } else {
        const list = normalizeList(value);
        if (path === "events") sharedEventsData = list;
        else if (path === "vacations") vacationsData = list;
        else if (path === "exams") examsData = list;
        else if (path === "hr_notices") hrData = list;
        else if (path === "task_board") taskBoardData = list;
        renderCalendar();
        if (path === "hr_notices") renderHRNotices();
        if (path === "task_board") renderTaskBoard();
      }
    } catch (refreshError) {
      console.error("保存失敗後のデータ再取得にも失敗:", path, refreshError);
    }
    return false;
  }
}

function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function generateTimetableInputs() {
const container = document.getElementById('timetable-inputs');
if (!container) return;
const days = ['月', '火', '水', '木', '金', '土'];
let html = '';
days.forEach((day, dIdx) => {
html += `<div><strong>${day}曜日</strong>`;
for (let h = 1; h <= 6; h++) {
html += `<input type="text" id="tt-${dIdx}-${h}" placeholder="${h}限" style="margin-top:2px;">`;
}
html += `</div>`;
});
container.innerHTML = html;
}

function updateTimetableInputs() {
for (let d = 0; d < 6; d++) {
for (let h = 1; h <= 6; h++) {
const input = document.getElementById(`tt-${d}-${h}`);
if (input && timeTableData[d]) {
input.value = timeTableData[d][h] || '';
}
}
}
}

function renderCalendar() {
const year = currentDate.getFullYear();
const month = currentDate.getMonth();

const monthDisplay = document.getElementById('month-display');
if (monthDisplay) monthDisplay.textContent = `${year}年 ${month + 1}月`;

const grid = document.getElementById('calendar-grid');
if (!grid) return;
grid.innerHTML = '';

dayNames.forEach(name => {
  const el = document.createElement('div');
  el.className = 'day-header';
  el.textContent = name;
  grid.appendChild(el);
});

// 曜日ごとの通常時間割ヘッダー（1時間ごとに改行）
dayNames.forEach((_, index) => {
  const el = document.createElement('div');
  el.className = 'timetable-header';

  if (index > 0 && index <= 6) {
    let html = `<strong>時間割</strong><br>`;
    let hasSubject = false;

    for (let h = 1; h <= 6; h++) {
      const val = (timeTableData[index - 1] && timeTableData[index - 1][h]) || '';
      if (val.trim() !== '') {
        html += `${h}限: ${escapeHTML(val)}<br>`;
        hasSubject = true;
      }
    }
    el.innerHTML = hasSubject ? html : '<strong>時間割</strong><br>-';
  } else {
    el.innerHTML = '<strong>時間割</strong><br>休業日';
  }
  grid.appendChild(el);
});

const firstDay = new Date(year, month, 1).getDay();
const lastDate = new Date(year, month + 1, 0).getDate();

for (let i = 0; i < firstDay; i++) {
  const emptyCell = document.createElement('div');
  emptyCell.className = 'day-cell';
  emptyCell.style.background = '#f9f9f9';
  grid.appendChild(emptyCell);
}

for (let date = 1; date <= lastDate; date++) {
  const cell = document.createElement('div');
  cell.className = 'day-cell';

  const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
  cell.innerHTML = `<div class="day-number">${date}</div>`;

  // 長期休みの判定 (↔付きでカレンダーに表示)
  const vacationName = checkVacationForDate(dateStr);
  if (vacationName) {
    const vacEl = document.createElement('div');
    vacEl.className = 'vacation-banner';
    vacEl.textContent = `↔ ${vacationName}`;
    cell.appendChild(vacEl);
  }

  // 定期試験の変則時間割判定
  const examInfo = checkExamForDate(dateStr);
  if (examInfo) {
    const examEl = document.createElement('div');
    examEl.style.cssText = 'font-size:0.75em; background:#fff3cd; border:1px solid #ffc107; padding:3px; margin-bottom:4px; border-radius:3px;';
    let examHtml = `<strong>📝 ${escapeHTML(examInfo.name)}</strong><br>`;
    let hasExamTt = false;
    if (examInfo.dailySchedule) {
      for (let h = 1; h <= 3; h++) {
        if (examInfo.dailySchedule[h]) {
          examHtml += `${h}限: ${escapeHTML(examInfo.dailySchedule[h])}<br>`;
          hasExamTt = true;
        }
      }
    }
    if (!hasExamTt) examHtml += '<span style="color:#666;">（時間割未設定）</span>';
    examEl.innerHTML = examHtml;
    cell.appendChild(examEl);
  }

  // 全体共有イベント
  sharedEventsData.forEach((ev, idx) => {
    if (ev && ev.date === dateStr) {
      const evEl = document.createElement('div');
      const tagClass = getTagClass(ev.tag);
      evEl.className = `event-item ${tagClass}`;
      evEl.innerHTML = `
        <div class="event-header-row">
          <span class="event-time">[共:${escapeHTML(ev.time || '')}]</span>
          <span>
            <button class="btn-small btn-edit" onclick="editEvent('shared', ${idx})">改</button>
            <button class="btn-small btn-danger" onclick="deleteEvent('shared', ${idx})">✕</button>
          </span>
        </div>
        <div class="event-desc">${escapeHTML(ev.desc || '')}</div>
      `;
      cell.appendChild(evEl);
    }
  });

  // 個人イベント
  personalEventsData.forEach((ev, idx) => {
    if (ev && ev.date === dateStr) {
      const evEl = document.createElement('div');
      const tagClass = getTagClass(ev.tag);
      evEl.className = `event-item ${tagClass}`;
      evEl.innerHTML = `
        <div class="event-header-row">
          <span class="event-time">[個:${escapeHTML(ev.time || '')}]</span>
          <span>
            <button class="btn-small btn-edit" onclick="editEvent('personal', ${idx})">改</button>
            <button class="btn-small btn-danger" onclick="deleteEvent('personal', ${idx})">✕</button>
          </span>
        </div>
        <div class="event-desc">${escapeHTML(ev.desc || '')}</div>
      `;
      cell.appendChild(evEl);
    }
  });

  grid.appendChild(cell);
}

renderVacationList();
renderExamList();

}

function getTagClass(tag) {
switch (tag) {
case 'danger': return 'tag-danger';
case 'success': return 'tag-success';
case 'warning': return 'tag-warning';
case 'purple': return 'tag-purple';
default: return 'tag-default';
}
}

function checkVacationForDate(dateStr) {
const target = new Date(dateStr);
for (let v of vacationsData) {
if (!v || !v.start || !v.end) continue;
const vStart = new Date(v.start);
const vEnd = new Date(v.end);
if (target >= vStart && target <= vEnd) {
return v.name;
}
}
return null;
}

function checkExamForDate(dateStr) {
const target = new Date(dateStr);
for (let e of examsData) {
if (!e || !e.start || !e.end) continue;
const eStart = new Date(e.start);
const eEnd = new Date(e.end);
if (target >= eStart && target <= eEnd) {
const dailySchedule = (e.schedules && e.schedules[dateStr]) || null;
return { name: e.name, dailySchedule };
}
}
return null;
}

function changeMonth(diff) {
currentDate.setMonth(currentDate.getMonth() + diff);
renderCalendar();
}

function saveTimetable() {
if (!requireHR()) return;

let data = {};
for (let d = 0; d < 6; d++) {
  data[d] = {};
  for (let h = 1; h <= 6; h++) {
    const input = document.getElementById(`tt-${d}-${h}`);
    data[d][h] = input ? input.value : '';
  }
}
pushData('timetable', data);

}

/* --- 定期試験管理（日別3限まで） --- */
function generateExamDateInputs() {
const startStr = document.getElementById('exam-start').value;
const endStr = document.getElementById('exam-end').value;
const container = document.getElementById('exam-daily-inputs-container');
const btnSave = document.getElementById('btn-save-exam');

if (!startStr || !endStr) {
  container.innerHTML = '';
  btnSave.style.display = 'none';
  return;
}

const start = new Date(startStr);
const end = new Date(endStr);

if (start > end) {
  container.innerHTML = '<p style="color:red;">開始日は終了日より前の日付にしてください。</p>';
  btnSave.style.display = 'none';
  return;
}

let curr = new Date(start);
let html = '<p style="font-size:0.85em; margin: 10px 0 5px 0;"><strong>各日の試験時間割（最大3限目まで）:</strong></p>';

while (curr <= end) {
  const dateVal = curr.toISOString().split('T')[0];
  const m = curr.getMonth() + 1;
  const d = curr.getDate();
  const dayName = dayNames[curr.getDay()];

  html += `
    <div class="exam-date-row">
      <strong style="font-size:0.85em;">📅 ${m}/${d} (${dayName})</strong>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 3px;">
        <input type="text" id="exam-input-${dateVal}-1" placeholder="1限">
        <input type="text" id="exam-input-${dateVal}-2" placeholder="2限">
        <input type="text" id="exam-input-${dateVal}-3" placeholder="3限">
      </div>
    </div>
  `;
  curr.setDate(curr.getDate() + 1);
}

container.innerHTML = html;
btnSave.style.display = 'inline-block';

}

function addExamSchedule() {
if (!requireHR()) return;

const startStr = document.getElementById('exam-start').value;
const endStr = document.getElementById('exam-end').value;
const name = document.getElementById('exam-name').value;

if (!startStr || !endStr || !name) {
  alert('試験の開始日・終了日・名称を入力してください。');
  return;
}

const start = new Date(startStr);
const end = new Date(endStr);

let schedules = {};
let curr = new Date(start);

while (curr <= end) {
  const dateVal = curr.toISOString().split('T')[0];
  schedules[dateVal] = {
    1: document.getElementById(`exam-input-${dateVal}-1`)?.value || '',
    2: document.getElementById(`exam-input-${dateVal}-2`)?.value || '',
    3: document.getElementById(`exam-input-${dateVal}-3`)?.value || ''
  };
  curr.setDate(curr.getDate() + 1);
}

examsData.push({ start: startStr, end: endStr, name, schedules });
pushData('exams', examsData);

document.getElementById('exam-start').value = '';
document.getElementById('exam-end').value = '';
document.getElementById('exam-name').value = '';
document.getElementById('exam-daily-inputs-container').innerHTML = '';
document.getElementById('btn-save-exam').style.display = 'none';

}

function deleteExamSchedule(idx) {
if (!requireHR()) return;
if (confirm('この定期試験設定を削除しますか？')) {
examsData.splice(idx, 1);
pushData('exams', examsData);
}
}

function renderExamList() {
const display = document.getElementById('exam-list-display');
if (!display) return;

if (examsData.length === 0) {
  display.innerHTML = '<p>登録済みの定期試験はありません。</p>';
  return;
}
let html = '<strong>登録済み定期試験:</strong><ul>';
examsData.forEach((e, idx) => {
  if (e) {
    html += `<li>${escapeHTML(e.name)}: ${e.start} 〜 ${e.end} 
      <button class="btn-small btn-danger" onclick="deleteExamSchedule(${idx})">削除</button></li>`;
  }
});
html += '</ul>';
display.innerHTML = html;

}

/* --- 予定の登録・編集・削除 --- */
function sendNotice() {
const scope = document.getElementById('event-scope').value;
const tag = document.getElementById('event-tag').value;
const date = document.getElementById('event-date').value;
const time = document.getElementById('event-time').value;
const desc = document.getElementById('event-desc').value;
const editIndex = parseInt(document.getElementById('event-edit-index').value);

if (!date || !desc) {
  alert('日付と内容を入力してください。');
  return;
}

const newEvent = { date, time, desc, tag };

if (editIndex >= 0) {
  const oldScope = document.getElementById('event-edit-scope').value;
  if (oldScope === 'shared') sharedEventsData.splice(editIndex, 1);
  else personalEventsData.splice(editIndex, 1);

  if (scope === 'shared') sharedEventsData.push(newEvent);
  else personalEventsData.push(newEvent);

  pushData('events', sharedEventsData);
  localStorage.setItem('personal_events', JSON.stringify(personalEventsData));
  cancelEventEdit();
} else {
  if (scope === 'shared') {
    sharedEventsData.push(newEvent);
    pushData('events', sharedEventsData);
  } else {
    personalEventsData.push(newEvent);
    localStorage.setItem('personal_events', JSON.stringify(personalEventsData));
    renderCalendar();
  }
}

document.getElementById('event-time').value = '';
document.getElementById('event-desc').value = '';

}

function editEvent(scope, idx) {
const ev = (scope === 'shared') ? sharedEventsData[idx] : personalEventsData[idx];
if (!ev) return;

document.getElementById('event-scope').value = scope;
document.getElementById('event-tag').value = ev.tag || 'default';
document.getElementById('event-date').value = ev.date;
document.getElementById('event-time').value = ev.time || '';
document.getElementById('event-desc').value = ev.desc || '';

document.getElementById('event-edit-index').value = idx;
document.getElementById('event-edit-scope').value = scope;
document.getElementById('event-form-title').textContent = '予定の編集';
document.getElementById('event-submit-btn').textContent = '変更を保存';
document.getElementById('event-cancel-btn').style.display = 'inline-block';

}

function cancelEventEdit() {
document.getElementById('event-edit-index').value = -1;
document.getElementById('event-edit-scope').value = '';
document.getElementById('event-form-title').textContent = '予定の登録・編集';
document.getElementById('event-submit-btn').textContent = '予定を追加';
document.getElementById('event-cancel-btn').style.display = 'none';
document.getElementById('event-time').value = '';
document.getElementById('event-desc').value = '';
}

function deleteEvent(scope, idx) {
if (confirm('この予定を削除しますか？')) {
if (scope === 'shared') {
sharedEventsData.splice(idx, 1);
pushData('events', sharedEventsData);
} else {
personalEventsData.splice(idx, 1);
localStorage.setItem('personal_events', JSON.stringify(personalEventsData));
renderCalendar();
}
}
}

/* --- クラス掲示板 --- */
function currentBoardAuthor() {
  const user = auth && auth.currentUser;
  if (!isSchoolAccount(user)) return null;
  // 掲示板にはメールアドレス由来の文字列を表示しない。
  return "4Bメンバー";
}

async function sendHRNotice() {
  if (!isSchoolAccount(auth && auth.currentUser)) {
    alert("学校の確認済みメールアドレスでログインしてください。");
    return;
  }
  const text = document.getElementById("hr-text").value.trim();
  const editIndex = Number.parseInt(document.getElementById("hr-edit-index").value, 10);
  if (!text) {
    alert("投稿内容を入力してください。");
    return;
  }
  if (text.length > 2000) {
    alert("投稿は2000文字以内にしてください。");
    return;
  }
  const author = currentBoardAuthor();
  const timestamp = new Date().toLocaleString("ja-JP");
  const oldData = hrData.slice();
  if (Number.isInteger(editIndex) && editIndex >= 0) {
    if (!hrData[editIndex]) return;
    const oldItem = hrData[editIndex];
    hrData[editIndex] = {
      text,
      date: oldItem.date || timestamp,
      editedAt: timestamp,
      author: oldItem.author || author
    };
  } else {
    hrData.unshift({ text, date: timestamp, author });
  }
  const button = document.getElementById("hr-submit-btn");
  button.disabled = true;
  const ok = await pushData("hr_notices", hrData);
  button.disabled = false;
  if (ok) cancelHREdit();
  else hrData = oldData;
}

function editHRNotice(idx) {
  const item = hrData[idx];
  if (!item) return;
  document.getElementById("hr-text").value = typeof item === "object" ? (item.text || "") : String(item);
  document.getElementById("hr-edit-index").value = idx;
  document.getElementById("hr-form-title").textContent = "掲示板の投稿を編集";
  document.getElementById("hr-submit-btn").textContent = "変更を保存";
  document.getElementById("hr-cancel-btn").style.display = "inline-block";
  document.getElementById("hr-text").focus();
}

function cancelHREdit() {
  document.getElementById("hr-edit-index").value = -1;
  document.getElementById("hr-form-title").textContent = "クラス掲示板";
  document.getElementById("hr-submit-btn").textContent = "投稿する";
  document.getElementById("hr-cancel-btn").style.display = "none";
  document.getElementById("hr-text").value = "";
}

async function deleteHRNotice(idx) {
  if (!isSchoolAccount(auth && auth.currentUser)) {
    alert("学校の確認済みメールアドレスでログインしてください。");
    return;
  }
  if (!hrData[idx] || !confirm("この投稿を削除しますか？")) return;
  const oldData = hrData.slice();
  hrData.splice(idx, 1);
  const ok = await pushData("hr_notices", hrData);
  if (!ok) hrData = oldData;
  if (Number.parseInt(document.getElementById("hr-edit-index").value, 10) === idx) cancelHREdit();
}

function renderHRNotices() {
  const listDisplay = document.getElementById("hr-list-display");
  if (!listDisplay) return;
  if (!hrData.length) {
    listDisplay.innerHTML = '<p style="color:#777;">まだ投稿はありません。</p>';
    return;
  }
  listDisplay.innerHTML = hrData.map((item, idx) => {
    if (!item) return "";
    const text = typeof item === "object" ? (item.text || "") : String(item);
    const date = typeof item === "object" ? (item.date || "") : "";
    const editedAt = typeof item === "object" ? (item.editedAt || "") : "";
    const author = typeof item === "object" ? (item.author || "学校アカウント") : "学校アカウント";
    return `
      <div class="card-item hr-notice">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:5px;">
          <strong style="color:#007bff;">${escapeHTML(author)}</strong>
          <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
            <span style="font-size:.75em;color:#888;">${escapeHTML(date)}${editedAt ? "（編集: " + escapeHTML(editedAt) + "）" : ""}</span>
            <button class="btn-small btn-edit" onclick="editHRNotice(${idx})">編集</button>
            <button class="btn-small btn-danger" onclick="deleteHRNotice(${idx})">削除</button>
          </div>
        </div>
        <p style="margin:5px 0;font-size:.95em;white-space:pre-wrap;overflow-wrap:anywhere;">${escapeHTML(text)}</p>
      </div>`;
  }).join("");
}

/* --- 課題掲示板 --- */
async function postTask() {
  if (!isSchoolAccount(auth && auth.currentUser)) {
    alert('学校の確認済みメールアドレスでログインしてください。');
    return;
  }
  const title = document.getElementById('task-title').value.trim();
  const detail = document.getElementById('task-detail').value.trim();
  const fileInput = document.getElementById('task-image');
  const file = fileInput ? fileInput.files[0] : null;
  const editIndex = Number.parseInt(document.getElementById('task-edit-index').value, 10);

  if (!title) {
    alert('科目・タイトルを入力してください。');
    return;
  }
  if (title.length > 200 || detail.length > 4000) {
    alert('タイトルは200文字以内、詳細は4000文字以内にしてください。');
    return;
  }
  if (file && !file.type.startsWith('image/')) {
    alert('画像ファイルを選択してください。');
    return;
  }
  if (file && file.size > 2 * 1024 * 1024) {
    alert('画像は2MB以下にしてください。Realtime Databaseへの大きな画像保存は避けてください。');
    return;
  }

  const button = document.getElementById('task-submit-btn');
  button.disabled = true;
  try {
    let imageData = null;
    if (file) {
      imageData = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('画像を読み込めませんでした。'));
        reader.readAsDataURL(file);
      });
    } else if (Number.isInteger(editIndex) && editIndex >= 0 && taskBoardData[editIndex]) {
      imageData = taskBoardData[editIndex].image || null;
    }

    const timestamp = new Date().toLocaleString('ja-JP');
    const oldData = taskBoardData.slice();
    const oldItem = Number.isInteger(editIndex) && editIndex >= 0 ? taskBoardData[editIndex] : null;
    const newTask = {
      title,
      detail,
      image: imageData,
      date: oldItem && oldItem.date ? oldItem.date : timestamp,
      editedAt: oldItem ? timestamp : '',
      // メールアドレスやその一部はデータに保存せず、表示名は固定する。
      author: '4Bメンバー'
    };

    if (Number.isInteger(editIndex) && editIndex >= 0) {
      if (!oldItem) {
        alert('編集対象の課題が見つかりません。ページを更新してください。');
        return;
      }
      taskBoardData[editIndex] = newTask;
    } else {
      taskBoardData.unshift(newTask);
    }

    const ok = await pushData('task_board', taskBoardData);
    if (ok) {
      cancelTaskEdit();
      document.getElementById('task-image-preview').textContent = '';
    } else {
      taskBoardData = oldData;
      renderTaskBoard();
    }
  } catch (error) {
    console.error('課題の保存準備中にエラー:', error);
    alert(error.message || '課題を保存できませんでした。');
  } finally {
    button.disabled = false;
  }
}

function editTask(idx) {
  const item = taskBoardData[idx];
  if (!item) return;
  document.getElementById('task-title').value = item.title || '';
  document.getElementById('task-detail').value = item.detail || '';
  document.getElementById('task-edit-index').value = idx;
  const preview = document.getElementById('task-image-preview');
  preview.textContent = item.image
    ? '※既に画像が添付されています（画像を選び直さなければ保持されます）'
    : '';
  document.getElementById('task-form-title').textContent = '課題の編集';
  document.getElementById('task-submit-btn').textContent = '変更を保存';
  document.getElementById('task-cancel-btn').style.display = 'inline-block';
  document.getElementById('task-title').focus();
}

function cancelTaskEdit() {
  document.getElementById('task-edit-index').value = -1;
  document.getElementById('task-form-title').textContent = '課題掲示板（写真添付可・全員共有）';
  document.getElementById('task-submit-btn').textContent = '課題を投稿する';
  document.getElementById('task-cancel-btn').style.display = 'none';
  document.getElementById('task-title').value = '';
  document.getElementById('task-detail').value = '';
  document.getElementById('task-image-preview').textContent = '';
  const fileInput = document.getElementById('task-image');
  if (fileInput) fileInput.value = '';
}

async function deleteTask(idx) {
  if (!isSchoolAccount(auth && auth.currentUser)) {
    alert('学校の確認済みメールアドレスでログインしてください。');
    return;
  }
  if (!taskBoardData[idx] || !confirm('この課題を削除しますか？')) return;
  const oldData = taskBoardData.slice();
  taskBoardData.splice(idx, 1);
  const ok = await pushData('task_board', taskBoardData);
  if (!ok) {
    taskBoardData = oldData;
    renderTaskBoard();
  }
}

function renderTaskBoard() {
  const listDisplay = document.getElementById('task-board-list');
  if (!listDisplay) return;
  if (taskBoardData.length === 0) {
    listDisplay.innerHTML = '<p style="color:#777;">現在投稿されている課題はありません。</p>';
    return;
  }
  listDisplay.innerHTML = taskBoardData.map((item, idx) => {
    if (!item) return '';
    const title = escapeHTML(item.title || '（タイトルなし）');
    const detail = escapeHTML(item.detail || '');
    const date = escapeHTML(item.date || '');
    const editedAt = escapeHTML(item.editedAt || '');
    const image = typeof item.image === 'string' && item.image.startsWith('data:image/')
      ? `<div style="margin-top:8px;"><img src="${item.image}" alt="課題の添付画像" style="max-width:100%;max-height:500px;object-fit:contain;border-radius:4px;border:1px solid #ddd;"></div>`
      : '';
    return `
      <div class="card-item task">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:5px;">
          <strong style="color:#d9534f;font-size:1.05em;">📚 ${title}</strong>
          <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
            <span style="font-size:.75em;color:#888;">${date}${editedAt ? '（編集: ' + editedAt + '）' : ''}</span>
            <button class="btn-small btn-edit" onclick="editTask(${idx})">編集</button>
            <button class="btn-small btn-danger" onclick="deleteTask(${idx})">削除</button>
          </div>
        </div>
        <div style="font-size:.8em;color:#666;margin-bottom:4px;">投稿者：4Bメンバー</div>
        <p style="margin:5px 0;font-size:.9em;white-space:pre-wrap;overflow-wrap:anywhere;">${detail}</p>
        ${image}
      </div>`;
  }).join('');
}

</script>
